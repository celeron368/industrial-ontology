视图: 数据
安装视图: 束测机箱.yaml
所属实体: 束测单元01

# 每块卡一行。波形规则按该卡物理视图的输入通道逐一展开，触发模式每卡展开一次。
# IOC 引用本视图中类型为 IOC进程 的实体。前缀和命名规则为本项目示例。
PV映射:
  命名规则:
    实时波形: {名称: "{前缀}:{通道}:WF", 访问: 只读}
    触发模式: {名称: "{前缀}:TRIG:MODE", 访问: 读写}
    # 以下为示例名，暂按每卡各一项展开。现场访问权限待核对。
    触发延时: {名称: "{前缀}:TRIG:DELAY", 访问: null}
    FFT带宽: {名称: "{前缀}:FFT:BW", 访问: null}
    K值设置: {名称: "{前缀}:POS:K", 访问: null}
  板卡绑定:
    导入:
      - 文件: 模板/板卡PV绑定.yaml
        参数: {板卡ID: 采集卡01, PV前缀: SBPM01, 控制进程: 板卡控制进程01}

# 每个数据接口必须通过“承载于”引用安装视图中已声明的 实体ID.接口名。
# 数据连接仅引用下列数据接口。顺序表示控制访问经过的节点。
数据接口:
  CPU主机端: {类型: PCIe 主机, 承载于: CPU板01.AMC}
  交换节点: {类型: PCIe 交换, 承载于: MCH01.背板}
  采集控制端: {类型: PCIe 端点, 承载于: 采集卡01.AMC}
  定时控制端: {类型: PCIe 端点, 承载于: 定时板01.AMC}
  机箱管理端: {类型: 网络管理服务, 承载于: MCH01.管理网口}

数据连接:
  采集控制路径: [CPU主机端, 交换节点, 采集控制端]
  定时控制路径: [CPU主机端, 交换节点, 定时控制端]

# 每个 IOC进程 必须通过“PV列表”关联自己的完整 PV 名录，路径相对于本文件。
# 文件每行一个 PV 名，以 # 开头的行为注释。常用 PV 映射展开后应能在所属 IOC 的名录中找到。
实体:
  板卡控制进程01:
    类型: IOC进程
    PV列表: PV列表/板卡控制进程01.txt
    运行于: CPU板01
    # 键是实体视图中的受控设备 ID，值是从运行主机到该设备的控制路径。
    控制对象:
      采集卡01: 采集控制路径
      定时板01: 定时控制路径
  机箱管理程序01:
    类型: 管理程序
    参考手册: MCH远程控制手册
    运行于: MCH01
    接收指令于: 机箱管理端
    监测: {对象: 机箱01, 属性: [供电, 温度]}
    操作: {对象: [采集卡01, 定时板01, CPU板01], 指令: [上电, 下电]}
  MCH远程控制手册:
    类型: 文档
    属性:
      资源地址: null
