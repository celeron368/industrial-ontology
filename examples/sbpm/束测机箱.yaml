# 实体的键就是唯一 ID。每个实体（含组合实体）都必须填写类型。
# 每个 ID 对应本文件旁的 历史/<ID>.yaml，操作按时间追加。
# 接口按类型分组。下表列出允许直连的类型组合，任一方向查表均有效。
视图: 安装
接口连接规则:
  探头信号输出: [信号输入]
  AMC 背板接口: [MicroTCA AMC 插槽]

束测单元01:
  类型: 束测单元
  实体:
    导入:
      - 文件: 模板/AMC-SBPM采集卡.yaml
        参数: {板卡ID: 采集卡01}
    SBPM探头01:
      类型: SBPM探头
      接口:
        探头信号输出: [OUT1, OUT2, OUT3, OUT4]
    机箱01:
      类型: MicroTCA 机箱
      接口:
        MicroTCA AMC 插槽: [slot1, slot2, slot3, slot4, slot5]

    定时板01:
      类型: 事件定时板
      接口:
        AMC 背板接口: [AMC]

    CPU板01:
      类型: AMC CPU 板
      接口:
        AMC 背板接口: [AMC]

    MCH01:
      类型: MCH
      接口:
        背板接口: [背板]  # 表示面向机箱背板的一侧，具体连接器待补。
        以太网接口: [管理网口]

  连接:
    # 每行列出相连的两个接口。槽位为示例分配。
    - [采集卡01.AMC, 机箱01.slot1]
    - [定时板01.AMC, 机箱01.slot2]
    - [CPU板01.AMC, 机箱01.slot3]
    - [SBPM探头01.OUT1, 采集卡01.IN1]
    - [SBPM探头01.OUT2, 采集卡01.IN2]
    - [SBPM探头01.OUT3, 采集卡01.IN3]
    - [SBPM探头01.OUT4, 采集卡01.IN4]
